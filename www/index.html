function addS(){S.sym.push({d:S.date,pain:+$('sp').value,t:$('st').value,f:$('sf').value,n:$('sn').value,fl:[['s1','nausea'],['s2','bloating'],['s3','reflux'],['s4','meds taken']].filter(x=>$(x[0]).checked).map(x=>x[1])});go()}
function dayRep(k=S.date){const d=dy(k),{t,m}=tot(d.e),T=S.tg,x=S.ex.filter(e=>e.d==k),sy=S.sym.filter(s=>s.d==k);
return [`Daily report ${k}`,...N.map(n=>`${L[n][0]}: ${r(t[n],1)} ${L[n][1]} (${pct(t[n],T[n])}% of ${T[n]})${m[n]?' [data missing for '+m[n]+' item(s)]':''}`),'',...MEALS.map((nm,i)=>`${nm}: ${r(tot(d.e.filter(e=>e.m==i)).t.kcal)} kcal`),`Protein remaining: ${r(Math.max(0,T.p-t.p),1)} g`,`Water: ${d.w} ml · Sleep: ${d.sl} h`,`Exercise: ${x.map(e=>e.t+' '+e.min+' min').join(', ')||'none logged'}`,`Ulcer symptoms: ${sy.map(s=>'pain '+s.pain).join(', ')||'none logged'}`,'Next meal: add a protein source (eggs, dal, fish, tofu, curd) with vegetables and a fibre-rich carbohydrate.'].join('\n')}
function weekRep(){const w=wk(),l=w.filter(k=>dy(k).e.length),a=n=>l.length?l.reduce((s,k)=>s+tot(dy(k).e).t[n],0)/l.length:0,c={};l.forEach(k=>dy(k).e.forEach(e=>c[food(e.fid).n]=(c[food(e.fid).n]||0)+1));const s=wsum(),ws=S.wl.slice(-2);
return `Weekly summary to ${S.date}\nDays logged: ${l.length}/7\nAverage calories: ${r(a('kcal'))} kcal · protein ${r(a('p'),1)} g\nExercise: ${s.n} sessions, ${s.min} min\nWeight: ${ws.map(x=>x.w).join(' → ')||'not recorded'}\nMost frequent foods: ${Object.entries(c).sort((x,y)=>y[1]-x[1]).slice(0,5).map(x=>x[0]+' ×'+x[1]).join(', ')||'none'}\n${l.length<5?'Attention: fewer than 5 logged days, so averages may be unreliable.':''}`}
function csv(){const q=s=>'"'+String(s).replace(/"/g,'""')+'"',o=[['date','meal','food','prep','qty','unit','grams',...N].join(',')];Object.keys(S.days).sort().forEach(k=>S.days[k].e.forEach(e=>{const f=food(e.fid);o.push([k,MEALS[e.m],q(f.n),q(e.v),e.q,e.u,r(grams(f,e.q,e.u),1),...nut(e).map(x=>x==null?'':x.toFixed(2))].join(','))}));return o.join('\n')}
function tests0(){const o=[],t=(n,k)=>o.push((k?'PASS ':'FAIL ')+n),a={fid:'moong',v:'boiled',q:130,u:'g'},b={...a,v:'dry'};
t('130 g cooked moong = 136.5 kcal, dry = 451.1 kcal',Math.abs(nut(a)[0]-136.5)<.1&&Math.abs(nut(b)[0]-451.1)<.2);
t('3 egg whites = 99 g, not 3 whole eggs',grams(D.ewhite,3,'piece')==99&&nut({fid:'ewhite',v:'raw/boiled',q:3,u:'piece'})[3]<1);
t('350 ml milk = 360.5 g',Math.abs(grams(D.milk,350,'ml')-360.5)<.01);t('1 tbsp oil = 13.8 g',Math.abs(grams(D.oil,1,'tbsp')-13.8)<.01);
t('totals are additive',Math.abs(tot([a,a]).t.kcal-2*nut(a)[0])<1e-9);
t('koozh recipe protein = ingredients',Math.abs(nut({fid:'koozh',v:'recipe (est.)',q:500,u:'ml'})[1]-16.375)<.01);
t('missing data is not counted as zero',tot([{fid:'tofu',v:'raw',q:100,u:'g'}]).m.ca==1);t('target percentage',pct(75,150)==50);return o.join('\n')}
function vRep(){const cf=Object.keys(S.custom);return `<div class="g"><div class="card"><h3>Daily report</h3><pre>${esc(dayRep())}</pre></div><div class="card"><h3>Weekly summary</h3><pre>${esc(weekRep())}</pre></div></div>
${vRep2()}<div class="card"><h3>Export</h3><div class="noprint"><button class="btn" onclick="dl('nutritrack-diary.csv',csv())">Download CSV</button> <button class="btn" onclick="try{window.print()}catch(e){}">Print / save as PDF</button> <small>If printing is blocked here, copy the text below instead.</small></div><textarea class="t" rows="6" readonly aria-label="CSV export">${esc(csv())}</textarea></div>
<div class="card"><h3>Backup and restore</h3><textarea class="t" id="bk" rows="5" aria-label="Backup data">${esc(JSON.stringify(S))}</textarea><button class="btn" onclick="dl('nutritrack-backup.json',JSON.stringify(S))">Download backup</button> <button class="btn s" onclick="sync()">Sync now</button> <span class="dm mut"></span><p><label>Restore from a backup file<input type="file" accept=".json" onchange="rf(this)"></label></p><button class="btn" onclick="try{S=JSON.parse($('bk').value);go()}catch(e){alert('Invalid backup')}">Restore from text</button> <button class="btn d" onclick="if(confirm('Erase all data?')){S=init();go()}">Reset all data</button></div>
<div class="card"><h3>Custom foods and recipes</h3>${cf.map(i=>`<div class="row" style="grid-template-columns:1fr auto"><span>${esc(S.custom[i].n)}</span><button class="btn d" onclick="delete S.custom['${i}'];go()">Delete</button></div>`).join('')||'<small>None yet.</small>'}</div>
<div class="card"><h3>Calculation self-test</h3><button class="btn s" onclick="this.nextElementSibling.textContent=tests()">Run tests</button><pre></pre></div>`}
applyLang();render();sync();document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
